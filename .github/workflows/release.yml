# Builds the app for Windows and for a Mac and attaches both to a release, whenever a version tag
# arrives in the public repository. The files get the names the
# website's download buttons ask for, which do not change from one version to the next.
#
# The addresses of the relay and of the hosted helper page are repository variables (Settings →
# Secrets and variables → Actions → Variables): LIGHT_ASSIST_RELAY_URL and LIGHT_ASSIST_PAGE_URL.
# Without them the app is built for the local network only.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  LIGHT_ASSIST_RELAY_URL: ${{ vars.LIGHT_ASSIST_RELAY_URL }}
  LIGHT_ASSIST_PAGE_URL: ${{ vars.LIGHT_ASSIST_PAGE_URL }}

jobs:
  windows:
    # Only where the world can see it: the private repository would pay for these minutes for nothing.
    if: ${{ !github.event.repository.private }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: rustup update stable --no-self-update
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo build --release -p light-assist
      - run: Copy-Item target/release/light-assist.exe LightAssist-Windows.exe
      - uses: softprops/action-gh-release@v2
        with:
          files: LightAssist-Windows.exe

  macos:
    if: ${{ !github.event.repository.private }}
    # An Apple silicon Mac. The app is signed for nobody in particular, so a Mac opens it only once its
    # user allows it in Privacy & Security; scripts/install-macos.sh builds a copy signed by its user.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: rustup update stable --no-self-update
      - run: pnpm install --frozen-lockfile
      - run: sh scripts/package-macos.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: target/macos/LightAssist-macOS.zip
