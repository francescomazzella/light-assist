# Builds the app for Windows and attaches it to a release, whenever a version tag arrives in the public
# repository. The file's name does not change from one version to the next.
#
# There is no Mac build here: a Mac lets an app see the screen only if someone has signed it, so the
# Mac app is built on the Mac it runs on, with its owner's certificate (scripts/install-macos.sh).
#
# The addresses of the relay and of the hosted helper page are repository variables (Settings →
# Secrets and variables → Actions → Variables): LIGHT_ASSIST_RELAY_URL and LIGHT_ASSIST_PAGE_URL.
# Without them the app is built for the local network only.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  LIGHT_ASSIST_RELAY_URL: ${{ vars.LIGHT_ASSIST_RELAY_URL }}
  LIGHT_ASSIST_PAGE_URL: ${{ vars.LIGHT_ASSIST_PAGE_URL }}

jobs:
  windows:
    # Only where the world can see it: the private repository would pay for these minutes for nothing.
    if: ${{ !github.event.repository.private }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: rustup update stable --no-self-update
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo build --release -p light-assist
      - run: Copy-Item target/release/light-assist.exe LightAssist-Windows.exe
      - uses: softprops/action-gh-release@v2
        with:
          files: LightAssist-Windows.exe
