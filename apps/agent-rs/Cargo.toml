[package]
name = "light-assist"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-or-later"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
getrandom = "0.4.3"
mdns-sd = "0.21.5"
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tao = "0.37.1"
tokio = { version = "1.53.2", default-features = false, features = ["rt", "net", "time", "sync", "macros", "signal"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "native-tls"] }
tray-icon = "0.26"
unsafe-libopus = "0.2.0"
wry = "0.57.0"

[target.'cfg(windows)'.dependencies]
str0m = { version = "0.24", default-features = false, features = ["wincrypto"] }
windows = { version = "0.62", features = [
    "ApplicationModel",
    "ApplicationModel_Activation",
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Storage_Packaging_Appx",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSCursor",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSPasteboard",
    "NSRunningApplication",
    "NSWorkspace",
    "libc",
    "objc2-core-graphics",
] }
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSError", "NSGeometry", "NSString"] }
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = [
    "std",
    "SCShareableContent",
    "SCStream",
    "block2",
    "dispatch2",
    "libc",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-core-media",
] }
objc2-video-toolbox = "0.3"

# Pure Rust everywhere but Windows. The Apple backend needs a Swift toolchain to build, and does not
# build with every Xcode.
[target.'cfg(not(windows))'.dependencies]
str0m = { version = "0.24", default-features = false, features = ["rust-crypto"] }

[build-dependencies]
winresource = "0.1.31"
